<!DOCTYPE html>
<html>
<head>
    <title>Grade Calculator</title>
</head>
<body>

    <h2>Grade Calculator</h2>

    <script>
        let total = 0;

        // Input marks of 4 subjects using loop
        for (let i = 1; i <= 4; i++) {
            let marks = Number(prompt("Enter marks of Subject " + i));
            total += marks;
        }

        let average = total / 4;
        let grade;

        if (average >= 90) {
            grade = "A+";
        } else if (average >= 80) {
            grade = "A";
        } else if (average >= 70) {
            grade = "B";
        } else if (average >= 60) {
            grade = "C";
        } else if (average >= 50) {
            grade = "D";
        } else {
            grade = "F";
        }

        document.write("<h3>Total Marks: " + total + "</h3>");
        document.write("<h3>Average Marks: " + average + "</h3>");
        document.write("<h3>Grade: " + grade + "</h3>");
    </script>

</body>
</html>
